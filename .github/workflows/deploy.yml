name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Déploiement Cloudflare Workers
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Localiser la sortie du build
        id: out
        run: |
          for d in dist .output; do
            if [ -f "$d/nitro.json" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then echo "Sortie du build introuvable"; find . -maxdepth 3 -name "*.mjs" -not -path "./node_modules/*"; exit 1; fi
          ENTRY=$(node -p "require('./$OUT/nitro.json').serverEntry")
          PUBLIC=$(node -p "require('./$OUT/nitro.json').publicDir")
          echo "entry=$OUT/$ENTRY" >> "$GITHUB_OUTPUT"
          echo "assets=$OUT/$PUBLIC" >> "$GITHUB_OUTPUT"
          echo "Entrée: $OUT/$ENTRY — Assets: $OUT/$PUBLIC"

      - name: Déployer avec Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy "${{ steps.out.outputs.entry }}" --assets "${{ steps.out.outputs.assets }}" --config wrangler.jsonc
